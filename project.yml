name: WorkoutSync
options:
  bundleIdPrefix: com.saraworkoutsync
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
  createIntermediateGroups: true

packages:
  TransportKit:
    path: Packages/TransportKit
  OverlayKit:
    path: Packages/OverlayKit
  RelayKit:
    path: Packages/RelayKit
  CaptureGuard:
    path: Packages/CaptureGuard

targets:
  WorkoutSyncWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/WorkoutSyncWatch
    dependencies:
      - package: TransportKit
      - package: CaptureGuard
    info:
      path: Apps/WorkoutSyncWatch/Info.plist
      properties:
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.saraworkoutsync.WorkoutSyncPhone
        NSHealthShareUsageDescription: "WorkoutSync reads your live heart rate and energy burned during a workout so it can stream them to your other devices."
        NSHealthUpdateUsageDescription: "WorkoutSync saves the workout session you record."
        UIBackgroundModes:
          - workout-processing
    entitlements:
      path: Apps/WorkoutSyncWatch/WorkoutSyncWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saraworkoutsync.WorkoutSyncPhone.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SUPPORTS_MACCATALYST: false
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic

  WorkoutSyncPhone:
    type: application
    platform: iOS
    sources:
      - path: Apps/WorkoutSyncPhone
    dependencies:
      - package: TransportKit
      - package: OverlayKit
      - package: RelayKit
      - target: WorkoutSyncWatch
        embed: true
    info:
      path: Apps/WorkoutSyncPhone/Info.plist
      properties:
        NSHealthShareUsageDescription: "WorkoutSync reads workout data to display it alongside your video."
        NSHealthUpdateUsageDescription: "WorkoutSync saves workout sessions."
        NSLocalNetworkUsageDescription: "WorkoutSync relays live workout metrics to Apple TV over your local network."
        NSBonjourServices:
          - _workoutsync._tcp
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Apps/WorkoutSyncPhone/WorkoutSyncPhone.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saraworkoutsync.WorkoutSyncPhone
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic

  WorkoutSyncTV:
    type: application
    platform: tvOS
    sources:
      - path: Apps/WorkoutSyncTV
    dependencies:
      - package: OverlayKit
      - package: RelayKit
    info:
      path: Apps/WorkoutSyncTV/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "WorkoutSync receives live workout metrics relayed from your iPhone."
        NSBonjourServices:
          - _workoutsync._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saraworkoutsync.WorkoutSyncTV
        SDKROOT: appletvos
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  WorkoutSyncPhone:
    build:
      targets:
        WorkoutSyncPhone: all
        WorkoutSyncWatch: all
    run:
      config: Debug
  WorkoutSyncTV:
    build:
      targets:
        WorkoutSyncTV: all
    run:
      config: Debug
